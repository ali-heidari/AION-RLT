[package]
name = "aion-rlt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
color-eyre = "0.6.5"
config = "0.15.18"
crossterm = "0.29.0"
env_logger = "0.11.8"
lazy_static = "1.5.0"
log = "0.4.28"
ndarray = { version = "0.16.1", features = ["serde"] }
ndarray-rand = "0.15.0"
rand = "0.8.0"
ratatui = { version = "0.29.0", features = ["termion"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.37.2"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "time"] }
aion-math = { git = "https://github.com/ali-heidari/aion-math" }
